# CI-Pflichtchecks (Qualitaets-Stabilisierung 18.08.2026):
# Ein PR/Push auf main gilt nur als gruen, wenn Tests, TypeScript, Lint UND
# Build sauber durchlaufen. Als Required Check im Branch-Schutz eintragen:
# Job-Name "qualitaet".
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualitaet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vereinheitlicht mit .nvmrc/engines (21.08.): lokal wie CI Node 24 /
          # npm 11 — damit erzeugen beide Seiten dasselbe Lockfile-Layout.
          node-version-file: .nvmrc
          cache: npm
      - name: Abhaengigkeiten
        # Reproduzierbar via npm ci. Faellt dieser Step mit EUSAGE (lock out of
        # sync), hat ein Commit package.json ohne Lockfile geaendert (z.B. eine
        # Lovable-Sandbox-Aenderung): lokal `npm install` ausfuehren und das
        # package-lock.json mit-committen.
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
