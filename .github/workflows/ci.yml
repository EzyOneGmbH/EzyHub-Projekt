# CI-Pflichtchecks (Qualitaets-Stabilisierung 18.08.2026):
# Ein PR/Push auf main gilt nur als gruen, wenn Tests, TypeScript, Lint UND
# Build sauber durchlaufen. Als Required Check im Branch-Schutz eintragen:
# Job-Name "qualitaet".
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualitaet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhaengigkeiten
        run: npm ci
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
